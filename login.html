<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Record System - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="./js/login.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </head>
  <body style="background-color:#f4f6f5;">
    <div class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
      <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <h4 class="mb-1" style="color:#006400;">Patient Record System</h4>
            <p class="text-muted mb-0">Sign in to continue</p>
          </div>

          <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" placeholder="Username" autocomplete="username" />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Password" autocomplete="current-password" />
          </div>

          <button type="button" class="btn w-100 text-white" style="background-color:#006400;" id="btn-login">
            Login
          </button>

          <p class="text-center text-muted mt-3 mb-0" style="font-size: 0.9rem;">
            Don't have an account? <a href="register.html">Sign up</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
